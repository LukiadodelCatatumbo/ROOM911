services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-reto_room_911}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    volumes:
      - room911_db_data:/var/lib/postgresql/data
    ports:
      # Publica la BD solo en localhost para administrarla con pgAdmin/DBeaver.
      # Si el host ya ocupa 5432 (postgres nativo), define DB_HOST_PORT en .env.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-reto_room_911}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_911/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-reto_room_911}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      SERVER_PORT: 8080
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (32+ caracteres)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      ACCESO_API_KEY: ${ACCESO_API_KEY:?Define ACCESO_API_KEY en el archivo .env (32+ caracteres aleatorios)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ROOM911_SEED_PASSWORD: ${ROOM911_SEED_PASSWORD:-}
      ROOM911_SYNC_SEED_PASSWORD: ${ROOM911_SYNC_SEED_PASSWORD:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo localhost: el frontend accede via proxy nginx y exponerlo en
      # 0.0.0.0 ampliaria innecesariamente la superficie de ataque.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: ./room911-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ACCESO_API_KEY: ${ACCESO_API_KEY:-}
        VITE_DEMO_USERNAME: ${VITE_DEMO_USERNAME:-}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
        VITE_SESSION_TIMEOUT_MINUTES: ${VITE_SESSION_TIMEOUT_MINUTES:-15}
        VITE_SESSION_WARNING_MINUTES: ${VITE_SESSION_WARNING_MINUTES:-1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-5173}:80"

volumes:
  room911_db_data:
