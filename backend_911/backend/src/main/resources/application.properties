spring.application.name=backend

# Database configuration with environment variable overrides
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reto_room_911}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Server configuration
server.port=${SERVER_PORT:8080}

# JWT configuration (en produccion JWT_SECRET DEBE definirse por entorno)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-production-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS (origenes permitidos separados por coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Contrasena inicial para los usuarios sembrados por DataInitializer
# Si no se define, se genera una aleatoria y se registra en el log al arrancar
room911.seed-password=${ROOM911_SEED_PASSWORD:}
# Solo para desarrollo local: sincroniza la contraseña semilla en administradores existentes.
room911.sync-seed-password=${ROOM911_SYNC_SEED_PASSWORD:false}
